name: Orca Bug Hunter & Health Watcher

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  inspect-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Library
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: 'Serangga AI Memeriksa Kode'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, glob, traceback
          try:
              print('🔍 Memeriksa API Key...')
              api_key = os.environ.get('GEMINI_API_KEY')
              if not api_key:
                  print('❌ API Key tidak ditemukan!')
                  exit(1)
              print('✅ API Key terdeteksi.')

              from google import genai
              client = genai.Client(api_key=api_key)
              
              files = glob.glob('*.html') + glob.glob('*.js') + glob.glob('*.css')
              print(f'📁 File ditemukan: {files}')
              
              if not files:
                  print('⚠️ Tidak ada file web di root repositori.')
              else:
                  for f_path in files[:3]:
                      with open(f_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read(1000)
                      print(f'🤖 [Orca Insect] Memeriksa file: {f_path} ...')
                      
                      response = client.models.generate_content(
                          model='gemini-2.0-flash',
                          contents=f'Kamu adalah bot pemeriksa web. Analisis singkat kode berikut dan berikan saran perbaikan/bug jika ada:\n\n{content}',
                      )
                      print(f'--- Laporan AI untuk {f_path} ---')
                      print(response.text)
                      print('-----------------------------------\n')
                      
              print('🎉 Si Serangga berhasil menyelesaikan tugasnya!')
          except Exception as e:
              print('❌ TERJADI ERROR:')
              traceback.print_exc()
              exit(1)
          "
