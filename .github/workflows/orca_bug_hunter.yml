name: Orca Bug Hunter & Health Watcher

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  inspect-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Library
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: 'Serangga AI Memeriksa Kode'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, glob
          from google import genai
          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print('❌ API Key tidak ditemukan!')
              exit(1)

          client = genai.Client(api_key=api_key)
          
          # Mengambil file HTML/JS/CSS utama
          files = glob.glob('*.html') + glob.glob('*.js') + glob.glob('*.css')
          if not files:
              print('⚠️ Tidak ada file web (HTML/JS/CSS) di root repositori.')
              exit(0)

          for f_path in files[:3]: # Cek maksimal 3 file dulu
              with open(f_path, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read(2000) # Baca 2000 karakter pertama
              
              print(f'🤖 [Orca Insect] Memeriksa file: {f_path} ...')
              prompt = f'Kamu adalah bot pemeriksa web. Analisis singkat kode berikut dan berikan saran perbaikan/bug jika ada:\n\n{content}'
              
              response = client.models.generate_content(
                  model='gemini-2.5-flash',
                  contents=prompt,
              )
              print(f'--- Laporan AI untuk {f_path} ---')
              print(response.text)
              print('-----------------------------------\n')
          "
