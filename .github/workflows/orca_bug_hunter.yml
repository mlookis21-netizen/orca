name: Orca Auto-Healer & Web Updater

on:
  workflow_dispatch:
    inputs:
      user_request:
        description: 'Permintaan pembaruan/fitur untuk situs web:'
        required: false
        default: 'Periksa error pada file HTML, rapikan kodenya, dan pastikan situs web optimal.'
        type: string
  schedule:
    - cron: '0 0 * * *'

jobs:
  auto-heal-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: '🤖 Si Serangga Beraksi (Menganalisis & Memperbaiki Web)'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          import os, glob
          from google import genai

          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print('❌ API Key tidak ditemukan!')
              exit(1)

          client = genai.Client(api_key=api_key)
          user_req = os.environ.get('INPUT_USER_REQUEST', 'Perbaiki error jika ada.')
          print(f'🎯 Misi Serangga: {user_req}')

          files = glob.glob('*.html') + glob.glob('*.js') + glob.glob('*.css')
          if not files:
              print('⚠️ Tidak ada file web ditemukan di root.')
              exit(0)

          for f_path in files[:1]: # Fokus ke file utama dulu (misal index.html)
              print(f'🔍 Membaca isi file: {f_path} ...')
              with open(f_path, 'r', encoding='utf-8', errors='ignore') as f:
                  original_code = f.read()

              # Prompt instruksi agar AI bertindak sebagai programmer otonom
              prompt = f"""
              Kamu adalah serangga digital otonom pengurus web. 
              Tugasmu adalah menganalisis file web berikut dan menerapkan perbaikan, perbaikan bug, atau menambahkan pembaruan berdasarkan permintaan ini: "{user_req}".
              
              PENTING: 
              - Berikan HANYA kode hasil perbaikan secara utuh (valid HTML/JS/CSS tergantung filenya).
              - Jangan sertakan penjelasan teks atau markdown (seperti ```html) di luar kodenya, berikan murni teks kodenya saja agar bisa langsung disimpan ke file.

              KODE ASLI:
              {original_code}
              """

              print('🧠 AI sedang memikirkan perbaikan kode...')
              response = client.models.generate_content(
                  model='gemini-2.0-flash',
                  contents=prompt,
              )
              
              new_code = response.text.strip()
              # Membersihkan pembungkus markdown jika AI tidak sengaja menyertakannya
              if new_code.startswith('```'):
                  new_code = '\n'.join(new_code.split('\n')[1:-1])

              if len(new_code) > 50: # Validasi keamanan agar file tidak kosong
                  with open(f_path, 'w', encoding='utf-8') as f:
                      f.write(new_code)
                  print(f'✅ Berhasil memperbarui file {f_path}!')
              else:
                  print('⚠️ Hasil kode dari AI terlalu pendek/tidak valid, perubahan dibatalkan.')
        shell: python

      - name: '🚀 Si Serangga Membuat Pull Request Otomatis'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Orca Insect Agent"
          git config --global user.email "orca-agent@bot.local"
          
          # Cek apakah ada perubahan file
          git status
          if git diff --quiet; then
              print('ℹ️ Tidak ada perubahan kode yang perlu diperbarui.')
          else
              BRANCH_NAME="orca-update-$(date +%s)"
              git checkout -b $BRANCH_NAME
              git add .
              git commit -m "🤖 Orca Agent: Otomatis memperbaiki dan memperbarui web"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git push origin $BRANCH_NAME
              
              # Membuat Pull Request secara otomatis menggunakan GitHub CLI
              gh pr create --title "🤖 Pembaruan Otomatis dari Si Serangga Orca" --body "Si serangga digital telah menganalisis situs web dan menerapkan pembaruan/perbaikan otomatis berdasarkan permintaan sistem." --base main --head $BRANCH_NAME
              echo "🎉 Pull Request berhasil dibuat!"
          fi
        shell: bash
